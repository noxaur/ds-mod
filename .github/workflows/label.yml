name: label

# @keep pull_request_target gives a fork's pull request a token that can label it, so only the base branch is checked out and the pull request is read through the API.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const labels = new Map([['feat', 'enhancement'], ['fix', 'bug'], ['docs', 'documentation']])
            const item = context.payload.pull_request ?? context.payload.issue
            const label = labels.get(/^(\w+)(\([^)]*\))?!?:/.exec(item.title)?.[1])
            // A title without one of these types keeps its labels, such as the bug label of the issue form.
            if (!label) return
            const { owner, repo } = context.repo
            const issue_number = item.number
            const current = item.labels.map(l => l.name)
            for (const stale of [...labels.values()].filter(l => l !== label && current.includes(l))) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: stale })
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] })
            }

  suppressions:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # @keep v5.2.9
        with:
          install_args: node
      - run: node scripts/suppressions.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
