name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # @keep The same game boot measured 25 seconds faster on ARM than on ubuntu-latest.
  mod:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup-mod
      - working-directory: mod
        run: ./gradlew ${{ steps.setup.outputs.gradle-args }} -Perrorprone=false :check -x lintCheck
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mod
          path: mod/build/reports/tests
          if-no-files-found: ignore
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.setup.outputs.warm }}

  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup-mod
        with:
          cache: lint
      - working-directory: mod
        run: ./gradlew ${{ steps.setup.outputs.gradle-args }} lintCheck
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.setup.outputs.warm }}

  pick:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup-mod
        with:
          cache: gametests
      - id: pick
        working-directory: mod
        run: |
          ./gradlew ${{ steps.setup.outputs.gradle-args }} -Perrorprone=false pickGameTests
          echo "jobs=$(cat build/gametests/jobs)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.setup.outputs.warm }}

  # @keep On main the picked change is empty, and its one job keeps the caches warm, because a pull request cannot read a cache another pull request saved.
  gametests:
    needs: pick
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.pick.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup-mod
        with:
          cache: gametests
      - uses: ./.github/actions/preload-gl
      - working-directory: mod
        env:
          TESTS: ${{ matrix.tests }}
        run: ./gradlew ${{ steps.setup.outputs.gradle-args }} -Perrorprone=false runProdClientGameTest "-Pgametests=$TESTS"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametests-${{ strategy.job-index }}
          path: |
            mod/build/run/prodClientGameTest/logs
            mod/build/run/prodClientGameTest/screenshots
          if-no-files-found: ignore
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.setup.outputs.warm }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # @keep v5.2.9
        with:
          install_args: node pnpm
      - id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'backend/pnpm-lock.yaml') }}
      - run: mise run check:backend
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.cache.outputs.cache-hit }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # @keep v5.2.9
        with:
          install_args: node pnpm
      - id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'web/pnpm-lock.yaml') }}
      - run: mise run check:web
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.cache.outputs.cache-hit }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # @keep v5.2.9
        id: mise
        with:
          install_args: node
      - run: mise run check:docs
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.mise.outputs.cache-hit }}

  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # @keep v5.2.9
        id: mise
        with:
          install_args: node ast-grep
      - run: mise run check:comments
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.mise.outputs.cache-hit }}
