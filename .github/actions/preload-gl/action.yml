name: Preload the GL driver
description: Reads Mesa and LLVM into the page cache in the background, so the game's first window does not wait for them. Put it before the Gradle step that starts the game.
runs:
  using: composite
  steps:
    # @keep The game's first window waits 0 to 20 seconds on Mesa and LLVM paging in from the runner's cold disk.
    - shell: bash
      run: |
        {
          gl=$(ls /usr/lib/*-linux-gnu/libGLX_mesa.so.0 /usr/lib/*-linux-gnu/libgallium-*.so)
          cat $gl $(ldd $gl | awk '$3 ~ /^\// { print $3 }' | sort -u) > /dev/null
        } 2>/dev/null &
