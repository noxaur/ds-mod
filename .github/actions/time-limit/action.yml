name: Time limit
description: Warns when the job has run longer than the limit. Put it last.
inputs:
  warm:
    description: "'true' when the job's cache was hit. A job that had to download its dependencies gets no warning."
    default: "true"
  seconds:
    description: The limit.
    default: "180"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WARM: ${{ inputs.warm }}
        LIMIT: ${{ inputs.seconds }}
      run: |
        started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
          --jq ".jobs[] | select(.runner_name == \"$RUNNER_NAME\") | .started_at")
        took=$(( $(date +%s) - $(date -d "$started" +%s) ))
        echo "$GITHUB_JOB took ${took}s of ${LIMIT}s." | tee -a "$GITHUB_STEP_SUMMARY"
        [ "$took" -le "$LIMIT" ] && exit 0
        [ "$WARM" != true ] && exit 0
        echo "::warning::$GITHUB_JOB took ${took}s, over CI's ${LIMIT}s. Make the job faster or move the slow part to the beta pipeline."
