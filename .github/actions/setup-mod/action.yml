name: Set up the mod build
description: Installs the pinned JDK and restores everything Gradle and Loom download or remap.
inputs:
  cache:
    description: Names the cache. A job that downloads more than `./gradlew check` does, such as the game's assets, needs its own, or it restores a cache without them and downloads them on every run.
    default: mod
outputs:
  warm:
    description: "'true' when the cache held everything, so the job has nothing to download."
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        install_args: java
    # One cache for the dependencies, the Gradle distribution, Minecraft and its remapped jars. The key is
    # every file that decides what gets downloaded, so a hit means the build needs no network. Every version,
    # the plugins' included, lives in gradle.properties, so an edit to the build scripts keeps the cache and
    # stays under the time limit.
    - id: key
      shell: bash
      run: echo "key=${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mod/gradle.properties', 'mod/gradle/wrapper/gradle-wrapper.properties') }}" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          mod/.gradle/loom-cache
        key: ${{ steps.key.outputs.key }}
    # The configuration cache spares the 15 to 40 seconds Loom takes to configure the project on a runner.
    # Gradle checks every build script and every file the configuration read, and configures again on any
    # change, so the newest entry is safe to restore. It is saved on every run, and its key starts with the
    # cache's, because Gradle encrypts it with a key that lives in ~/.gradle/caches.
    - uses: actions/cache@v6
      with:
        path: mod/.gradle/configuration-cache
        key: ${{ steps.key.outputs.key }}-configuration-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.key.outputs.key }}-configuration-
