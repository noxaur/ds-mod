name: Set up the mod build
description: Installs the pinned JDK and restores everything Gradle and Loom download or remap.
inputs:
  cache:
    description: Names the cache. A job that downloads more than `./gradlew check` does, such as the game's assets, needs its own, or it restores a cache without them and downloads them on every run.
    default: mod
outputs:
  warm:
    description: "'true' when the cache held everything, so the job has nothing to download."
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        install_args: java
    # One cache for the dependencies, the Gradle distribution, Minecraft and its remapped jars. The key is
    # every file that decides what gets downloaded, so a hit means the build needs no network. Every version,
    # the plugins' included, lives in gradle.properties, so an edit to the build scripts keeps the cache and
    # stays under the time limit.
    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          mod/.gradle/loom-cache
        key: ${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mod/gradle.properties', 'mod/gradle/wrapper/gradle-wrapper.properties') }}
