[tools]
java = "temurin-25"
node = "24"
pnpm = "10.34.9"

# A commit runs `mise run check`. See .githooks/pre-commit.
[hooks]
postinstall = "git config core.hooksPath .githooks"

[tasks."check:mod"]
dir = "mod"
run = "./gradlew check"

[tasks."check:backend"]
dir = "backend"
run = ["pnpm install --frozen-lockfile", "pnpm check"]

[tasks."check:web"]
dir = "web"
run = ["pnpm install --frozen-lockfile", "pnpm check"]

[tasks."check:docs"]
dir = "docs"
run = '''
fail=0
for page in $(find user internals operations -name '*.md' | sort); do
  grep -qF "($page)" README.md || { echo "docs/README.md:1: link $page here with one line on what it covers"; fail=1; }
done
if grep -nHEi '^#+ +(add|how to|write|run|check|verify|test)s?( |$)' internals/*.md; then
  echo "docs/internals records why, not steps. Move the recipe to docs/operations/."
  fail=1
fi
if grep -nHwi 'your' operations/*.md; then
  echo "docs/operations is read by an agent. The machine, desktop and accounts are the user's, so write \"the user's\"."
  fail=1
fi
exit $fail
'''

[tasks.check]
description = "Runs every project's checks"
depends = ["check:mod", "check:backend", "check:web", "check:docs"]
